[hidden]{display:none!important}

<script>
(() => {
const D = window.BUS_DATA;
const $ = s => document.querySelector(s);
const TYPES = [
  ['일반', '--t-normal'], ['좌석', '--t-seat'], ['마을', '--t-village'], ['직행좌석', '--t-direct'], ['광역', '--t-wide'], ['공항', '--t-air']
];
const SPEED = { '마을': 15, '일반': 18, '좌석': 22, '광역': 24, '직행좌석': 30, '공항': 34 }; // km/h, 정차 포함 전 평균 주행
const DWELL = 14, LAYOVER = 360;

function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); };
const fmtS = s => fmt(s) + ':' + String(Math.floor(s) % 60).padStart(2, '0');

/* ---------- 노선 준비 ---------- */
const routes = D.routes.map(r => {
  const v = SPEED[r.type] / 3.6;
  const dirs = r.dirs.filter(d => d.len >= 500).map(d => {
    const n = d.line.length / 2, pts = new Float32Array(d.line), cum = new Float32Array(n);
    for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + Math.hypot(pts[2 * i] - pts[2 * i - 2], pts[2 * i + 1] - pts[2 * i - 1]);
    const st = d.stops.map(([i, s], k) => ({ i, s, a: s / v + k * DWELL }));
    return { to: d.to, from: d.from, first: d.first, last: d.last, pts, cum, len: cum[n - 1], stops: st, T: cum[n - 1] / v + st.length * DWELL };
  });
  // 가는 방향 = 차고지·종점에서 나가는 쪽, 오는 방향 = 차고지·종점으로 돌아오는 쪽
  const home = /차고지|종점|회차지/;
  if (dirs.length === 2 && home.test(dirs[0].to) && !home.test(dirs[1].to)) dirs.reverse();
  // 양쪽 기점에서 같은 시간표로 출발한다고 본다 (반대 방향은 회차 시간만큼 늦게)
  dirs.forEach((d, i) => { d.off = i ? Math.min(1800, LAYOVER + 600) : 0; });
  const off = Math.max(...dirs.map(d => d.T)) + dirs[dirs.length - 1].off;
  const h = hash(r.ref);
  const vil = r.type === '마을';
  const first = (vil ? 6 * 3600 : 5 * 3600) + (h % 6) * 300;
  const last = (vil ? 22 * 3600 : 22.5 * 3600) + ((h >> 4) % 7) * 300;
  const cycMin = off / 60;
  const base = Math.round((vil ? 11 + (h >> 8) % 4 : r.type === '직행좌석' ? 25 : r.type === '좌석' || r.type === '광역' ? 15 + (h >> 8) % 5 : 9 + (h >> 8) % 6) + cycMin / 30);
  const deps = [];
  for (let t = first; t <= last;) {
    deps.push(t);
    const hr = t / 3600;
    const mul = (hr >= 7 && hr < 9) || (hr >= 17 && hr < 19.5) ? 0.75 : hr >= 21 ? 1.4 : 1;
    t += Math.round(base * mul) * 60;
  }
  if (deps[deps.length - 1] !== last) deps.push(last);
  // 경기도 공식 시간표가 있으면: 방향마다 공식 첫차~막차, 출퇴근(7~9시·17~19시)은 출퇴근 배차, 그 밖은 평시 배차
  const sc = r.sched;
  let F = first, Lt = last, hwText = base + '분';
  if (sc && dirs.every(d => d.first && d.last)) {
    const pk = +sc.peak || base, np = +sc.npeak || pk;
    dirs.forEach(d => {
      d.off = 0; d.deps = [];
      for (let t = d.first; t <= d.last;) { d.deps.push(t); const hr = t / 3600; t += ((hr >= 7 && hr < 9) || (hr >= 17 && hr < 19) ? pk : np) * 60; }
      if (d.deps[d.deps.length - 1] !== d.last) d.deps.push(d.last);
    });
    F = Math.min(...dirs.map(d => d.first)); Lt = Math.max(...dirs.map(d => d.last));
    hwText = pk === np ? pk + '분' : pk + '~' + np + '분';

/* ---------- 실시간 위치 (중계 서버가 있을 때만) ----------

    let found = false;
    for (const base of rtBases()) {
      try {
        const r = await fetch(base + 'api/locations?routes=210000009', { cache: 'no-store' });
        if (!r.ok) continue;
